<!DOCTYPE html>

<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#E9E7F2" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#4D3076" media="(prefers-color-scheme: dark)" />
        <meta name="text-scale" content="scale" />
        <meta name="description" content="✨ A website designed to answer every question you can imagine." />
        <meta name="keywords" content="npm,typescript,eslint,a11y,prettier,svelte,husky,tailwindcss,vite,sveltekit,magic-answer" />

        <title>Magic Answers</title>

        <link rel="author" href="https://www.linkedin.com/in/claire-math%C3%A9-ux-ui-designer-%E2%9C%AE/" />
        <link rel="author" href="https://github.com/FlorianLeChat" />

        <meta name="author" content="Claire Mathé" />
        <meta name="author" content="Florian Trayon" />

        <meta property="og:title" content="Magic Answers" />
        <meta property="og:description" content="✨ A website designed to answer every question you can imagine." />
        <meta property="og:url" content="https://github.com/FlorianLeChat/Magic-Answers" />
        <meta property="og:image" content="assets/images/opengraph.png" />
        <meta property="og:type" content="website" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:creator" content="@FlorianTrayon" />
        <meta name="twitter:title" content="Magic Answers" />
        <meta name="twitter:description" content="✨ A website designed to answer every question you can imagine." />
        <meta name="twitter:image" content="assets/images/opengraph.png" />

        <script>
            const key = "magic-answers:theme";
            const element = document.documentElement;

            let stored = null;

            try {
                stored = localStorage.getItem(key);
            } catch {
                /* storage unavailable, the system preference decides on every visit */
            }

            element.classList.remove("light", "dark");

            const chosen = stored === "light" || stored === "dark";
            const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

            element.classList.add(chosen ? stored : system);
        </script>

        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover" class="min-w-sm">
        <div style="display: contents">
            %sveltekit.body%
        </div>
    </body>
</html>
